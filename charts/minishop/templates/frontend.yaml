apiVersion: v1
kind: Service
metadata:
  name: minishop-frontend
  namespace: webapp
spec:
  ports:
    - name: http
      port: 8080
      targetPort: http
  selector:
    app.kubernetes.io/component: frontend
    app.kubernetes.io/name: minishop
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minishop-frontend
  namespace: webapp
spec:
  replicas: {{ .Values.replicas.frontend }}
  selector:
    matchLabels:
      app.kubernetes.io/component: frontend
      app.kubernetes.io/name: minishop
  template:
    metadata:
      labels:
        app.kubernetes.io/component: frontend
        app.kubernetes.io/name: minishop
        app.kubernetes.io/part-of: minishop
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: frontend
          image: {{ include "minishop.image" (dict "root" . "name" "frontend") }}
          imagePullPolicy: IfNotPresent
          args:
            - -P
            - http://minishop-backend:3001
          ports:
            - containerPort: 8080
              name: http
          livenessProbe:
            httpGet:
              path: /
              port: http
            failureThreshold: 3
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /
              port: http
            failureThreshold: 3
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
          resources:
            {{- toYaml .Values.resources.frontend | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
