apiVersion: v1
kind: Service
metadata:
  name: minishop-backend
  namespace: webapp
  labels:
    app.kubernetes.io/component: minishop-backend
    app.kubernetes.io/name: minishop
spec:
  ports:
    - name: http
      port: 3001
      targetPort: http
  selector:
    app.kubernetes.io/component: minishop-backend
    app.kubernetes.io/name: minishop
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minishop-backend
  namespace: webapp
spec:
  replicas: {{ .Values.replicas.backend }}
  selector:
    matchLabels:
      app.kubernetes.io/component: minishop-backend
      app.kubernetes.io/name: minishop
  template:
    metadata:
      labels:
        app.kubernetes.io/component: minishop-backend
        app.kubernetes.io/name: minishop
        app.kubernetes.io/part-of: minishop
    spec:
      serviceAccountName: minishop-backend
      automountServiceAccountToken: false
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/component: minishop-backend
                    app.kubernetes.io/name: minishop
      securityContext:
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: backend
          image: {{ include "minishop.image" (dict "root" . "name" "backend") }}
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3001
              name: http
          env:
            - name: POSTGRES_DB
              value: minishop
            - name: POSTGRES_HOST
              value: minishop-postgresql.data.svc.cluster.local
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  key: postgres-password
                  name: {{ .Values.credentials.appSecretName }}
            - name: POSTGRES_PORT_NUM
              value: "5432"
            - name: POSTGRES_USER
              value: minishop
            - name: REDIS_HOST
              value: minishop-redis.data.svc.cluster.local
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  key: redis-password
                  name: {{ .Values.credentials.appSecretName }}
            - name: REDIS_PORT
              value: "6379"
          livenessProbe:
            httpGet:
              path: /
              port: http
            failureThreshold: 3
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /
              port: http
            failureThreshold: 3
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
          resources:
            {{- toYaml .Values.resources.backend | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
