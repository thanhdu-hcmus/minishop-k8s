apiVersion: v1
kind: Service
metadata:
  name: minishop-postgresql-headless
  namespace: data
spec:
  clusterIP: None
  ports:
    - name: postgresql
      port: 5432
      targetPort: postgresql
  selector:
    app.kubernetes.io/component: database
    app.kubernetes.io/name: minishop-postgresql
---
apiVersion: v1
kind: Service
metadata:
  name: minishop-postgresql
  namespace: data
spec:
  ports:
    - name: postgresql
      port: 5432
      targetPort: postgresql
  selector:
    app.kubernetes.io/component: database
    app.kubernetes.io/name: minishop-postgresql
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: minishop-postgresql
  namespace: data
spec:
  replicas: {{ .Values.replicas.postgresql }}
  serviceName: minishop-postgresql-headless
  selector:
    matchLabels:
      app.kubernetes.io/component: database
      app.kubernetes.io/name: minishop-postgresql
  template:
    metadata:
      labels:
        app.kubernetes.io/component: database
        app.kubernetes.io/name: minishop-postgresql
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 999
        runAsGroup: 999
        runAsNonRoot: true
        runAsUser: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgresql
          image: {{ include "minishop.image" (dict "root" . "name" "postgresql") }}
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5432
              name: postgresql
          env:
            - name: POSTGRES_DB
              value: minishop
            - name: POSTGRES_USER
              value: minishop
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  key: postgres-password
                  name: {{ .Values.credentials.dataSecretName }}
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -ec
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            failureThreshold: 6
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -ec
                - PGPASSWORD="$POSTGRES_PASSWORD" psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -c 'SELECT 1' >/dev/null
            failureThreshold: 6
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            {{- toYaml .Values.resources.postgresql | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: false
          volumeMounts:
            - mountPath: /var/lib/postgresql/data
              name: postgresql-data
  volumeClaimTemplates:
    - metadata:
        name: postgresql-data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 4Gi
        storageClassName: standard
