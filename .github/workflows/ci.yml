name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read
  issues: read

jobs:
  ci:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0
      - name: Check Conventional Commits
        run: |
          if [ "${{ github.event_name }}" = pull_request ]; then
            commit_range="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
          else
            commit_range="${{ github.event.before }}..${{ github.sha }}"
          fi
          npx --yes @commitlint/cli@19.8.1 --from "${commit_range%%..*}" --to "${commit_range##*..}"
      - name: Check AGENTS.md size
        run: test "$(wc -c < AGENTS.md)" -le 15360
      - name: Lint YAML
        run: |
          python3 -m pip install --disable-pip-version-check yamllint==1.35.1
          yamllint .github
      - name: Check devlog requirement
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_LABELS: ${{ toJson(github.event.pull_request.labels.*.name) }}
        run: |
          changed="$(git diff --name-only "$BASE_SHA" HEAD)"
          if printf '%s\n' "$PR_LABELS" | grep -q 'trivial'; then exit 0; fi
          if printf '%s\n' "$changed" | grep -qv '^docs/'; then
            if ! printf '%s\n' "$changed" | grep -q '^docs/devlog/'; then
              echo 'Non-doc changes require a docs/devlog entry or the trivial label.' >&2
              exit 1
            fi
          fi
      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
