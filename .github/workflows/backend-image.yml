---
name: Backend image

on:
  pull_request:
    paths:
      - ".github/workflows/backend-image.yml"
      - "images/backend/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/backend-image.yml"
      - "images/backend/**"

permissions:
  contents: read

env:
  IMAGE_NAME: ghcr.io/thanhdu-hcmus/minishop-backend

jobs:
  validate:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Docker Buildx
        # yamllint disable-line rule:line-length
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435

      - name: Build and test backend image
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83
        with:
          context: images/backend
          target: test
          push: false

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish backend image
        id: build
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83
        with:
          build-args: SOURCE_REVISION=${{ github.sha }}
          context: images/backend
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
          push: true
          tags: ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}

      - name: Record published digest
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          summary="$GITHUB_STEP_SUMMARY"
          printf 'Published %s@%s\n' "$IMAGE_NAME" "$IMAGE_DIGEST" >> "$summary"
          printf '%s\n' 'Deployment consumers must pin this digest.' >> "$summary"
