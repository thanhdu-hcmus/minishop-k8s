# Image source: Docker Official Image, https://hub.docker.com/_/redis
# Release: redis:7.4.7-bookworm
# Resolved digest: sha256:976ab0f0939b78c06d802bcd3bea44c5142ea9a756a57b861e08819817f768c8
apiVersion: v1
kind: Service
metadata:
  name: minishop-redis-headless
  namespace: data
spec:
  clusterIP: None
  ports:
    - name: redis
      port: 6379
      targetPort: redis
  selector:
    app.kubernetes.io/component: cache
    app.kubernetes.io/name: minishop-redis
---
apiVersion: v1
kind: Service
metadata:
  name: minishop-redis
  namespace: data
spec:
  ports:
    - name: redis
      port: 6379
      targetPort: redis
  selector:
    app.kubernetes.io/component: cache
    app.kubernetes.io/name: minishop-redis
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: minishop-redis
  namespace: data
spec:
  replicas: 1
  serviceName: minishop-redis-headless
  selector:
    matchLabels:
      app.kubernetes.io/component: cache
      app.kubernetes.io/name: minishop-redis
  template:
    metadata:
      labels:
        app.kubernetes.io/component: cache
        app.kubernetes.io/name: minishop-redis
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 999
        runAsGroup: 999
        runAsNonRoot: true
        runAsUser: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: redis
          image: redis@sha256:976ab0f0939b78c06d802bcd3bea44c5142ea9a756a57b861e08819817f768c8
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -ec
            - exec redis-server --appendonly yes --appendfsync everysec --requirepass "$REDIS_PASSWORD"
          ports:
            - containerPort: 6379
              name: redis
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  key: redis-password
                  name: minishop-data-credentials
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -ec
                - REDISCLI_AUTH="$REDIS_PASSWORD" redis-cli ping >/dev/null
            failureThreshold: 6
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -ec
                - REDISCLI_AUTH="$REDIS_PASSWORD" redis-cli ping >/dev/null
            failureThreshold: 6
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            limits:
              cpu: 250m
              memory: 256Mi
            requests:
              cpu: 50m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: false
          volumeMounts:
            - mountPath: /data
              name: redis-data
  volumeClaimTemplates:
    - metadata:
        name: redis-data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi
        storageClassName: standard
