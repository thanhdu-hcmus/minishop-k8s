apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: minishop-postgres
  namespace: data
spec:
  instances: 2
  storage:
    storageClass: local-path
    size: 2Gi
  bootstrap:
    initdb:
      database: kumademo
      owner: kumademo
      secret:
        name: postgres-creds
  affinity:
    nodeSelector:
      workload-type: database
    tolerations:
      - key: dedicated
        operator: Equal
        value: database
        effect: NoSchedule
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {cpu: 500m, memory: 512Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: data
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: minishop
    app.kubernetes.io/component: redis
  ports:
    - name: redis
      port: 6379
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  namespace: data
spec:
  serviceName: redis
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: minishop
      app.kubernetes.io/component: redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: minishop
        app.kubernetes.io/component: redis
    spec:
      nodeSelector:
        workload-type: database
      tolerations:
        - key: dedicated
          operator: Equal
          value: database
          effect: NoSchedule
      containers:
        - name: redis
          image: kvn0218/kuma-redis@sha256:23fb64fd5bfb76d0e90387efb467626d73fb55d66a8e86e7196d894659eaf13d
          args: ["redis-server", "--appendonly", "yes", "--dir", "/data"]
          ports:
            - name: redis
              containerPort: 6379
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 250m, memory: 256Mi}
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: local-path
        resources:
          requests: {storage: 1Gi}

