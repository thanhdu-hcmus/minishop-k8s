apiVersion: v1
kind: Namespace
metadata:
  name: data
---
apiVersion: v1
kind: Namespace
metadata:
  name: webapp
---
apiVersion: v1
kind: Namespace
metadata:
  name: monitoring
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: minishop-runtime
  namespace: webapp
data:
  POSTGRES_HOST: minishop-postgres-rw.data.svc.cluster.local
  POSTGRES_PORT_NUM: "5432"
  POSTGRES_DB: kumademo
  POSTGRES_USER: kumademo
  REDIS_HOST: redis.data.svc.cluster.local
  REDIS_PORT: "6379"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: api-backend-sa
  namespace: webapp
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: developer
  namespace: webapp
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: developer
  namespace: data
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: developer-read
  namespace: webapp
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: developer-read
  namespace: webapp
subjects:
  - kind: ServiceAccount
    name: developer
    namespace: webapp
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: developer-read
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: developer-read
  namespace: data
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: developer-read
  namespace: data
subjects:
  - kind: ServiceAccount
    name: developer
    namespace: data
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: developer-read
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: minishop-postgres
  namespace: data
spec:
  instances: 2
  storage:
    storageClass: local-path
    size: 2Gi
  bootstrap:
    initdb:
      database: kumademo
      owner: kumademo
      secret:
        name: postgres-creds
  affinity:
    nodeSelector:
      workload-type: database
    tolerations:
      - key: dedicated
        operator: Equal
        value: database
        effect: NoSchedule
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {cpu: 500m, memory: 512Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: data
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: minishop
    app.kubernetes.io/component: redis
  ports:
    - name: redis
      port: 6379
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  namespace: data
spec:
  serviceName: redis
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: minishop
      app.kubernetes.io/component: redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: minishop
        app.kubernetes.io/component: redis
    spec:
      nodeSelector:
        workload-type: database
      tolerations:
        - key: dedicated
          operator: Equal
          value: database
          effect: NoSchedule
      containers:
        - name: redis
          image: kvn0218/kuma-redis@sha256:23fb64fd5bfb76d0e90387efb467626d73fb55d66a8e86e7196d894659eaf13d
          args: ["redis-server", "--appendonly", "yes", "--dir", "/data"]
          ports:
            - name: redis
              containerPort: 6379
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 250m, memory: 256Mi}
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: local-path
        resources:
          requests: {storage: 1Gi}
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: webapp
  labels:
    app.kubernetes.io/name: minishop
    app.kubernetes.io/component: backend
spec:
  selector:
    app.kubernetes.io/name: minishop
    app.kubernetes.io/component: backend
  ports:
    - name: http
      port: 3001
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: webapp
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: minishop
      app.kubernetes.io/component: backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: minishop
        app.kubernetes.io/component: backend
    spec:
      serviceAccountName: api-backend-sa
      nodeSelector:
        workload-type: app
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: minishop
                    app.kubernetes.io/component: backend
                topologyKey: kubernetes.io/hostname
      initContainers:
        - name: wait-for-postgres
          image: postgres:16-alpine
          command: ["sh", "-c", "until pg_isready -h minishop-postgres-rw.data.svc.cluster.local -p 5432; do sleep 2; done"]
      containers:
        - name: backend
          image: kvn0218/kuma-demo-be@sha256:2b96a497dfee7e3f1166b89d61e13d46909a75daa19b0f80b705195309e8944a
          ports:
            - name: http
              containerPort: 3001
          envFrom:
            - configMapRef:
                name: minishop-runtime
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-app-creds
                  key: password
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 500m, memory: 256Mi}
        - name: postgres-readiness-gate
          image: postgres:16-alpine
          command: ["sh", "-c", "sleep infinity"]
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -h minishop-postgres-rw.data.svc.cluster.local -p 5432"]
            periodSeconds: 5
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {cpu: 50m, memory: 64Mi}
        - name: redis-readiness-gate
          image: kvn0218/kuma-redis@sha256:23fb64fd5bfb76d0e90387efb467626d73fb55d66a8e86e7196d894659eaf13d
          command: ["sh", "-c", "sleep infinity"]
          readinessProbe:
            exec:
              command: ["sh", "-c", "redis-cli -h redis.data.svc.cluster.local -p 6379 ping | grep PONG"]
            periodSeconds: 5
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {cpu: 50m, memory: 64Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: webapp
  labels:
    app.kubernetes.io/name: minishop
    app.kubernetes.io/component: frontend
spec:
  selector:
    app.kubernetes.io/name: minishop
    app.kubernetes.io/component: frontend
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: webapp
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: minishop
      app.kubernetes.io/component: frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: minishop
        app.kubernetes.io/component: frontend
    spec:
      nodeSelector:
        workload-type: app
      containers:
        - name: frontend
          image: kvn0218/kuma-demo-fe@sha256:e72c87263cc19bc7ea9d04978f6601d9adab01e9fc5a642219c206f154f9eb48
          args: ["-P", "http://backend.webapp.svc.cluster.local:3001"]
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            tcpSocket: {port: http}
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 250m, memory: 128Mi}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: db-migration
  namespace: webapp
spec:
  backoffLimit: 2
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: psql
          image: postgres:16-alpine
          command: ["sh", "-c", "psql -v ON_ERROR_STOP=1 -f /schema/database.sql"]
          envFrom:
            - configMapRef: {name: minishop-runtime}
          env:
            - name: PGHOST
              value: minishop-postgres-rw.data.svc.cluster.local
            - name: PGPORT
              value: "5432"
            - name: PGDATABASE
              value: kumademo
            - name: PGUSER
              value: kumademo
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef: {name: postgres-app-creds, key: password}
          volumeMounts:
            - name: schema
              mountPath: /schema
      volumes:
        - name: schema
          configMap:
            name: minishop-postgres-schema
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: minishop-frontend
  namespace: webapp
spec:
  ingressClassName: nginx
  rules:
    - host: minishop.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port: {number: 8080}
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-loadbalancer-demo
  namespace: webapp
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: minishop
    app.kubernetes.io/component: frontend
  ports:
    - port: 8080
      targetPort: http
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: backend
  namespace: webapp
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: backend
  minReplicas: 3
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 50
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: postgres-report
  namespace: webapp
spec:
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: report
              image: postgres:16-alpine
              command: ["sh", "-c", "psql -Atc 'select count(*) from marketItems' | xargs -I{} echo 'marketItems={}'"]
              env:
                - name: PGHOST
                  value: minishop-postgres-rw.data.svc.cluster.local
                - name: PGPORT
                  value: "5432"
                - name: PGDATABASE
                  value: kumademo
                - name: PGUSER
                  value: kumademo
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef: {name: postgres-app-creds, key: password}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: backend
  namespace: monitoring
  labels:
    release: monitoring
spec:
  namespaceSelector:
    matchNames: [webapp]
  selector:
    matchLabels:
      app.kubernetes.io/name: minishop
      app.kubernetes.io/component: backend
  endpoints:
    - port: http
      path: /metrics
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: minishop-backend
  namespace: monitoring
  labels:
    release: monitoring
spec:
  groups:
    - name: minishop
      rules:
        - alert: MiniShopBackendRestarting
          expr: increase(kube_pod_container_status_restarts_total{namespace="webapp",container="backend"}[5m]) > 0
          for: 1m
          labels:
            severity: warning
          annotations:
            summary: MiniShop backend restarted
---
